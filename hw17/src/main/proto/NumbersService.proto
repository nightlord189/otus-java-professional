syntax = "proto3";

package org.aburavov.otus.java.professional.hw17;

option java_multiple_files = true;

message SequenceRequest {
    int64 firstValue = 1;
    int64 lastValue = 2;
}

message NumberResponse {
    int64 value = 1;
}

service NumbersService {
    rpc generateSequence (SequenceRequest) returns (stream NumberResponse);
}
